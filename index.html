
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Scanner - Home Clock-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h2 { margin-bottom: 10px; }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 20px auto;
      background: white;
    }

    #status {
      padding: 15px;
      margin: 15px auto;
      max-width: 420px;
      background: white;
      border-radius: 8px;
      line-height: 1.5;
    }

    button {
      padding: 14px 25px;
      border: 0;
      border-radius: 8px;
      background: #444;
      color: white;
      font-size: 16px;
    }

    body[dir="rtl"] {
      direction: rtl;
    }
  </style>
</head>

<body>
  <h2 id="title">Scanner le QR code</h2>
  <p id="instruction">Place le QR code devant la caméra de ton téléphone.</p>

  <div id="reader"></div>
  <div id="status">Démarrage de la caméra…</div>

  <button id="cancelButton" onclick="cancelScanner()">Annuler</button>

  <script>

    let scanFinished = false;

    const translations = {

        transmissionError: "Error sending the QR code.",
        cameraError: "Unable to open the camera: ",

        cancel: "Cancel"
      },
      ru: {
        title: "Сканировать QR-код",

        transmissionError: "Nagkaroon ng error sa pagpapadala ng QR code.",

      },

        detected: "Codice QR rilevato. Invio in corso…",
        transmitted: "Codice QR inviato. Ritorno alla timbratura…",
        noOpener: "Impossibile tornare alla timbratura. Chiudi questa pagina e riprova.",
        transmissionError: "Errore durante l'invio del codice QR.",
        cameraError: "Impossibile aprire la fotocamera: ",
        safari: ". Controlla le autorizzazioni di Safari.",
        cancel: "Annulla"
      },
      ar: {
        title: "مسح رمز QR",
        instruction: "ضع رمز QR أمام كاميرا هاتفك.",
        starting: "جارٍ تشغيل الكاميرا…",
        active: "الكاميرا نشطة. ضع رمز QR أمام العدسة.",
        detected: "تم اكتشاف رمز QR. جارٍ الإرسال…",
        transmitted: "تم إرسال رمز QR. جارٍ العودة إلى تسجيل الوقت…",
        noOpener: "تعذرت العودة إلى تسجيل الوقت. أغلق هذه الصفحة وحاول مرة أخرى.",
        transmissionError: "حدث خطأ أثناء إرسال رمز QR.",
        cameraError: "تعذر فتح الكاميرا: ",
        safari: ". تحقق من أذونات Safari.",
        cancel: "إلغاء"
      },
      bm: {
        title: "QR code scan",
        instruction: "I ka QR code bila i ka telefoni kamera ɲɛ.",
        starting: "Kamera bɛ daminɛ…",
        active: "Kamera bɛ baara kɛ. QR code bila kamera ɲɛ.",
        detected: "QR code ye a la. Bɛ ci…",
        transmitted: "QR code sera. Bɛ segin don sɛbɛnni kan…",
        noOpener: "Aw ye segin don sɛbɛnni kan. Aw ye nin yɔrɔ datugu ka segin a la.",
        transmissionError: "Fili kɛra QR code ci la.",
        cameraError: "Kamera ma se ka dayɛlɛ: ",
        safari: ". Aw ye Safari la sɔrɔli lajɛ.",
        cancel: "A dabila"
      }
    };

    function getLanguage() {
      const params = new URLSearchParams(window.location.search);
      let lang = params.get("lang");

      if (!lang && window.opener) {
        try {
          lang = window.opener.localStorage.getItem("pointage_language");
        } catch (e) {}
      }

      if (!lang) {
        lang = navigator.language || "fr";
      }

      lang = lang.toLowerCase().split("-")[0];

      if (lang === "mo") lang = "ro";
      if (lang === "tl") lang = "fil";

      return translations[lang] ? lang : "fr";
    }

    const currentLanguage = getLanguage();
    const t = translations[currentLanguage];

    function applyLanguage() {
      document.documentElement.lang = currentLanguage;
      document.documentElement.dir = currentLanguage === "ar" ? "rtl" : "ltr";
      document.body.dir = currentLanguage === "ar" ? "rtl" : "ltr";

      document.getElementById("title").textContent = t.title;
      document.getElementById("instruction").textContent = t.instruction;
      document.getElementById("cancelButton").textContent = t.cancel;
      showStatus(t.starting);
    }

    function showStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function startScanner() {
      try {
        if (!window.Html5Qrcode) {
          throw new Error("QR_READER_LOAD_ERROR");
        }

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1
          },
          async function(decodedText) {
            if (scanFinished) return;
            scanFinished = true;

            showStatus(t.detected);

            try {
              await scanner.stop();

              if (!window.opener) {
                showStatus(t.noOpener);
                return;
              }

              window.opener.postMessage(
                {
                  type: "POINTAGE_QR_SCANNED",
                  token: decodedText
                },
                "*"
              );

              showStatus(t.transmitted);

              setTimeout(function() {
                window.close();
              }, 700);

            } catch (error) {
              showStatus(t.transmissionError);
              scanFinished = false;
            }
          },
          function() {
            // Les tentatives de lecture sans QR détecté sont normales.
          }
        );

        showStatus(t.active);

      } catch (error) {
        const detail = error.message === "QR_READER_LOAD_ERROR"
          ? t.cameraError + "QR reader" + t.safari
          : t.cameraError + (error.message || error) + t.safari;

        showStatus(detail);
      }
    }

    async function cancelScanner() {
      scanFinished = true;

      if (scanner) {
        try {
          await scanner.stop();
        } catch (e) {}
      }

      window.close();
    }

    applyLanguage();
    startScanner();
  </script>
</body>
</html>
